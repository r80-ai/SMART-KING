name: Android Build & Release

on:
  push:
    branches:
      - main
      - backup-clean
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (for manual dispatch)'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag Name (optional, e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required. Found: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "Creating empty fallback .env..."
            touch .env
          fi

      - name: Setup debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in root directory."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating temporary debug keystore for assembleDebug..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f "./debug.keystore" ]; then
            echo "Confirmed ./debug.keystore exists."
          else
            echo "::error::Failed to provide ./debug.keystore."
            exit 1
          fi

      - name: Verify BiRefNet ONNX Asset
        run: |
          MODEL_PATH="app/src/main/assets/birefnet_lite_fp16.onnx"
          if [ -f "$MODEL_PATH" ]; then
            FILE_SIZE=$(wc -c < "$MODEL_PATH" | tr -d ' ')
            echo "BiRefNet model asset verified: $MODEL_PATH ($FILE_SIZE bytes)"
          else
            echo "::warning::Model file not found at $MODEL_PATH before Gradle task."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Listing files in app/build/outputs/apk/ if available:"
            find app/build/outputs/apk -name "*.apk" -print || true
            exit 1
          fi
          
          FILE_SIZE=$(wc -c < "$EXPECTED_APK" | tr -d ' ')
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::Generated APK is empty (0 bytes)."
            exit 1
          fi
          echo "Verified APK successfully: $EXPECTED_APK ($FILE_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release metadata & asset
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true'))
        id: prepare_release
        run: |
          TMP_DIR="${RUNNER_TEMP:-/tmp}/release_assets"
          mkdir -p "$TMP_DIR"
          
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="v1.0-build-${{ github.run_number }}"
          fi
          
          ASSET_NAME="PDF-Master-${TAG_NAME}-debug.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH for tag: $TAG_NAME"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true'))
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: PDF Master ${{ steps.prepare_release.outputs.tag_name }}
          body: |
            ### 📱 PDF Master Debug Release (${{ steps.prepare_release.outputs.tag_name }})
            
            - **Commit**: ${{ github.sha }}
            - **Ref / Branch**: ${{ github.ref_name }}
            - **Build Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Release Assets**:
              - `app-debug.apk`
              - `${{ steps.prepare_release.outputs.asset_name }}`
            
            > **Installation**: Download the `.apk` file directly to your Android device to install and use.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.prepare_release.outputs.asset_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Build & Release Result
        if: always()
        run: |
          echo "=== Build & Release Summary ==="
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(wc -c < "app/build/outputs/apk/debug/app-debug.apk" | tr -d ' ')
            echo "✅ Debug APK built successfully: app/build/outputs/apk/debug/app-debug.apk ($APK_SIZE bytes)"
            echo "📦 Artifact 'PDF-Master-Debug-APK' uploaded to GitHub Actions."
            {
              echo "## 📱 PDF Master Build Summary"
              echo "- **Status**: ✅ APK Generated Successfully"
              echo "- **Size**: $((APK_SIZE / 1024 / 1024)) MB"
              echo "- **Artifact**: \`PDF-Master-Debug-APK\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Debug APK was not generated."
            {
              echo "## ❌ Build Failed"
              echo "Debug APK was not found at app/build/outputs/apk/debug/app-debug.apk"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="${{ steps.prepare_release.outputs.tag_name }}"
            REL_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
            echo "🚀 GitHub Release created successfully: $REL_URL"
            {
              echo ""
              echo "### 🚀 GitHub Release Published"
              echo "- **Release Tag**: \`${TAG}\`"
              echo "- **Download URL**: [${TAG} Release](${REL_URL})"
              echo "- **Assets**: \`app-debug.apk\`, \`${{ steps.prepare_release.outputs.asset_name }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || github.event.inputs.create_release == 'true')) }}" = "true" ]; then
            echo "⚠️ Release publishing was attempted but did not complete successfully. Check logs above."
          else
            echo "ℹ️ Branch push build completed. (Pushed to branch '${{ github.ref_name }}'. To publish a Release, push a 'v*' tag, e.g.: git tag v1.0 && git push origin v1.0)"
            {
              echo ""
              echo "### ℹ️ Release Note"
              echo "This build was triggered by a branch push to \`${{ github.ref_name }}\`."
              echo "The APK is available in the **Artifacts** section below."
              echo "To automatically create a GitHub Release, push a version tag:"
              echo "\`\`\`bash"
              echo "git checkout ${{ github.ref_name }}"
              echo "git tag v1.0"
              echo "git push origin v1.0"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
