name: Android Build & Release

on:
  push:
    branches:
      - backup-clean
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Release Tag (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required. Found: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "Creating empty fallback .env..."
            touch .env
          fi

      - name: Setup debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in root directory."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating debug keystore for assembleDebug..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f "./debug.keystore" ]; then
            echo "Confirmed ./debug.keystore exists."
          else
            echo "::error::Failed to provide ./debug.keystore."
            exit 1
          fi

      - name: Verify BiRefNet ONNX Asset
        run: |
          MODEL_PATH="app/src/main/assets/birefnet_lite_fp16.onnx"
          if [ -f "$MODEL_PATH" ]; then
            FILE_SIZE=$(wc -c < "$MODEL_PATH" | tr -d ' ')
            echo "BiRefNet model asset verified: $MODEL_PATH ($FILE_SIZE bytes)"
          else
            echo "::warning::Model file not found at $MODEL_PATH before Gradle task."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Listing files in app/build/outputs/apk/ if available:"
            find app/build/outputs/apk -name "*.apk" -print || true
            exit 1
          fi
          
          FILE_SIZE=$(wc -c < "$EXPECTED_APK" | tr -d ' ')
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::Generated APK is empty (0 bytes)."
            exit 1
          fi
          echo "Verified APK successfully: $EXPECTED_APK ($FILE_SIZE bytes)"

      - name: Prepare release asset
        id: prepare_release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            if [ "${{ github.run_attempt }}" -gt 1 ]; then
              TAG_NAME="v1.0.0-b${{ github.run_number }}.${{ github.run_attempt }}"
            else
              TAG_NAME="v1.0.0-b${{ github.run_number }}"
            fi
          fi
          
          # Target release asset name requested: PDF-Master-Debug.apk
          RELEASE_APK="PDF-Master-Debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_APK"
          
          APK_BYTES=$(wc -c < "$RELEASE_APK" | tr -d ' ')
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_apk=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_APK ($APK_BYTES bytes) for Tag: $TAG_NAME"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-Debug-APK
          path: PDF-Master-Debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: PDF Master ${{ steps.prepare_release.outputs.tag_name }}
          body: |
            ### 📱 PDF Master Automatic Release (${{ steps.prepare_release.outputs.tag_name }})
            
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Release Asset**: `PDF-Master-Debug.apk` ($(( ${{ steps.prepare_release.outputs.apk_size_bytes }} / 1024 / 1024 )) MB)
            
            > **Direct Download**: Download `PDF-Master-Debug.apk` below directly to your Android device to install.
          files: |
            PDF-Master-Debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release and Attached APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prepare_release.outputs.tag_name }}"
          echo "=== Verifying GitHub Release for tag: $TAG ==="
          gh release view "$TAG"
          echo "Confirmed: GitHub Release '$TAG' is verified and PDF-Master-Debug.apk is published!"

      - name: Report Build & Release Result
        if: always()
        run: |
          echo "=== Build & Release Summary ==="
          if [ -f "PDF-Master-Debug.apk" ]; then
            APK_SIZE=$(wc -c < "PDF-Master-Debug.apk" | tr -d ' ')
            TAG="${{ steps.prepare_release.outputs.tag_name }}"
            REL_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
            echo "✅ Debug APK built successfully: PDF-Master-Debug.apk ($APK_SIZE bytes)"
            echo "🚀 GitHub Release: $REL_URL"
            {
              echo "## 📱 PDF Master Automatic Build & Release"
              echo "- **Status**: ✅ Succeeded"
              echo "- **Release Tag**: \`${TAG}\`"
              echo "- **Release APK**: [PDF-Master-Debug.apk](${REL_URL})"
              echo "- **Size**: $((APK_SIZE / 1024 / 1024)) MB"
              echo "- **Direct Download**: [Download APK](${REL_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed. Debug APK was not generated."
            {
              echo "## ❌ Build Failed"
              echo "Debug APK was not generated. No Release was published."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
