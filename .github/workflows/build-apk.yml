name: Build and Release Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force Pull LFS Objects
        run: |
          git lfs install
          git lfs pull
          ls -lh app/src/main/assets/birefnet_lite_fp16.onnx

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          if [ ! -f "./.env" ]; then
            if [ -f "./.env.example" ]; then
              cp ./.env.example ./.env
            else
              touch ./.env
            fi
          fi

          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from ./debug.keystore.base64..."
            base64 -d "./debug.keystore.base64" > "./debug.keystore"
          elif [ -f "./.github/debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from ./.github/debug.keystore.base64..."
            base64 -d "./.github/debug.keystore.base64" > "./debug.keystore"
          elif [ -f "./app/debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from ./app/debug.keystore.base64..."
            base64 -d "./app/debug.keystore.base64" > "./debug.keystore"
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring persistent debug.keystore from GitHub secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "./debug.keystore"
          elif [ -f "./debug.keystore" ]; then
            echo "Using existing debug.keystore in workspace..."
          else
            echo "::error::Persistent debug signing keystore not found!" >&2
            echo "To keep the verified SHA-1 (D5:86:68:06:DA:A6:12:2E:35:87:0A:64:B7:0E:2F:02:29:36:36:FE) stable:" >&2
            echo "  Option A: Commit 'debug.keystore.base64' into your repository root or .github folder." >&2
            echo "  Option B: In your GitHub repository, go to Settings -> Secrets and variables -> Actions, and add secret 'DEBUG_KEYSTORE_BASE64'." >&2
            exit 1
          fi

          echo "Verifying debug keystore alias 'androiddebugkey'..."
          KEYSTORE_INFO=$(keytool -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey) || {
            echo "::error::Keystore verification failed for alias 'androiddebugkey'!" >&2
            exit 1
          }
          echo "Verified debug.keystore SHA-1 fingerprint:"
          echo "$KEYSTORE_INFO" | grep "SHA1:"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Generate Update Manifest
        run: |
          mkdir -p updates
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
            APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
            CERT_SHA256=$(keytool -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" | awk '{print $2}' | tr -d ':')
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            cat <<EOF > updates/smart_king_update.json
          {
            "manifestSchemaVersion": 1,
            "appId": "com.aistudio.pdfmaster.qvrx",
            "latestVersionCode": ${{ github.run_number }},
            "latestVersionName": "1.1.0",
            "minimumSupportedVersionCode": 1,
            "mandatoryUpdate": false,
            "releaseTitle": "SMART KING Debug Build #${{ github.run_number }}",
            "releaseNotes": "Automated build #${{ github.run_number }} from commit ${{ github.sha }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-debug.apk",
            "releasePageUrl": "https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}",
            "apkSha256": "$APK_SHA256",
            "signingCertificateSha256": "$CERT_SHA256",
            "publishedAt": "$PUB_DATE",
            "fileSizeBytes": $APK_SIZE,
            "nextManifestUrl": null
          }
          EOF
            cp updates/smart_king_update.json updates/smart_king_update_manifest.json
            cp updates/smart_king_update.json updates/smart_king_update
            echo "Generated update manifest with latestVersionCode=${{ github.run_number }}, size=$APK_SIZE bytes, SHA256=$APK_SHA256"
          else
            echo "::warning::APK file not found at $APK_FILE"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: SMART KING Debug Build #${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            updates/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
