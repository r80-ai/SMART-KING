name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - backup-clean
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"

          # Query Java specification version directly from JVM properties
          JAVA_MAJOR=$(java -XshowSettings:properties -version 2>&1 | awk -F'=' '/java\.specification\.version/ {gsub(/[[:space:]]/, "", $2); print $2}')

          # Robust fallback: extract leading integer following 'version "' on first line
          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')
          fi

          echo "Detected Java major version: '$JAVA_MAJOR'"

          case "$JAVA_MAJOR" in
            ''|*[!0-9]*)
              echo "::error::Failed to parse a valid integer Java major version. Output was: '$JAVA_MAJOR'"
              exit 1
              ;;
            *)
              if [ "$JAVA_MAJOR" -lt 17 ]; then
                echo "::error::Java major version $JAVA_MAJOR is lower than required version 17."
                exit 1
              fi
              echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."
              ;;
          esac

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment and debug keystore
        shell: bash
        run: |
          # Ensure .env exists so Secrets Gradle Plugin can read properties cleanly
          if [ ! -f "./.env" ]; then
            if [ -f "./.env.example" ]; then
              echo "Copying .env.example to .env..."
              cp ./.env.example ./.env
            else
              echo "Creating fallback .env..."
              touch ./.env
            fi
          fi

          # Ensure debug.keystore exists for signing
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists and is valid."

      - name: Build debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK file '$EXPECTED_APK' does not exist."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::'$EXPECTED_APK' is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::'$EXPECTED_APK' does not have the .apk extension."
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')
          echo "Verified APK exists: $EXPECTED_APK ($APK_SIZE bytes)"

          # Test zip integrity and verify essential contents
          if command -v unzip >/dev/null 2>&1; then
            echo "Testing APK zip integrity with unzip..."
            if ! unzip -tq "$EXPECTED_APK"; then
              echo "::error::APK package integrity check failed (corrupt zip archive)."
              exit 1
            fi

            if ! unzip -l "$EXPECTED_APK" | grep -q "AndroidManifest.xml"; then
              echo "::error::Invalid APK: AndroidManifest.xml missing from archive."
              exit 1
            fi
            echo "APK archive structure verified (AndroidManifest.xml present)."
          fi

          echo "APK verification passed successfully!"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}/apk_release_asset"
          mkdir -p "$RUNNER_TMP_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="pdf-master"
          fi

          RELEASE_ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${RUNNER_TMP_DIR}/${RELEASE_ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at '$RELEASE_ASSET_PATH'."
            exit 1
          fi

          RELEASE_TAG="debug-v${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT:-1}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})"

          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GitHub CLI Check ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file not found or empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi

          NOTES="### 📱 Automated Debug Build #${GITHUB_RUN_NUMBER}

- **Build Type**: Debug APK
- **File**: \`${ASSET_NAME}\`
- **Branch**: \`${GITHUB_REF_NAME}\`
- **Run Number**: ${GITHUB_RUN_NUMBER}
- **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
- **Commit**: ${GITHUB_SHA}
- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

> ℹ️ **Installation Note**: You can download and install \`${ASSET_NAME}\` directly on Android devices for testing."

          echo "Checking if release '$RELEASE_TAG' already exists..."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists. Updating existing release..."
            
            if ! gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$NOTES"; then
              echo "::warning::Failed to update release title/notes for '$RELEASE_TAG'."
            fi

            echo "Uploading APK asset directly to release '$RELEASE_TAG'..."
            if ! UPLOAD_OUT=$(gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber 2>&1); then
              echo "::error::Failed to upload APK asset to existing release '$RELEASE_TAG':"
              echo "$UPLOAD_OUT"
              {
                echo "error_message<<EOF_ERR"
                echo "$UPLOAD_OUT"
                echo "EOF_ERR"
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "$UPLOAD_OUT"
          else
            echo "Release '$RELEASE_TAG' does not exist. Creating new release..."
            
            # Create release and attach the .apk file directly
            if ! CREATE_OUT=$(gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest 2>&1); then
              echo "Initial creation with --target failed: $CREATE_OUT"
              echo "Retrying without explicit target..."
              
              if ! CREATE_OUT=$(gh release create "$RELEASE_TAG" "$ASSET_PATH" \
                --title "$RELEASE_TITLE" \
                --notes "$NOTES" \
                --latest 2>&1); then
                echo "::error::Failed to create GitHub Release '$RELEASE_TAG':"
                echo "$CREATE_OUT"
                {
                  echo "error_message<<EOF_ERR"
                  echo "$CREATE_OUT"
                  echo "EOF_ERR"
                } >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            echo "$CREATE_OUT"
          fi

          echo "Successfully published APK to GitHub Release '$RELEASE_TAG'!"
          echo "release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          ERROR_MSG="${{ steps.publish_release.outputs.error_message }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release URL: $RELEASE_URL"
            echo "Direct Asset: $ASSET_NAME"

            {
              echo "## 🚀 Build & Release Succeeded"
              echo ""
              echo "### 📱 Download Debug APK Directly"
              echo "The debug APK has been published to GitHub Releases:"
              echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Direct APK File**: You can download **\`$ASSET_NAME\`** directly from the **Assets** section on the release page."
              echo ""
              echo "### 📦 Backup Actions Artifact"
              echo "The build artifact named **\`app-debug-apk\`** is also available in the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::GitHub Release publishing did not succeed."
            if [ -n "$ERROR_MSG" ]; then
              echo "Release error details:"
              echo "$ERROR_MSG"
            fi

            {
              echo "## ⚠️ Release Publishing Notice"
              echo ""
              echo "The debug APK was **built successfully** and uploaded as a GitHub Actions artifact."
              echo ""
              if [ -n "$ERROR_MSG" ]; then
                echo "### ❌ Release Publishing Error Details"
                echo "\`\`\`"
                echo "$ERROR_MSG"
                echo "\`\`\`"
                echo ""
                echo "**Tip**: If the error mentions \`Resource not accessible by integration\`, please check repository settings: **Settings → Actions → General → Workflow permissions** and select **Read and write permissions**."
                echo ""
              fi
              echo "### 📦 Download Instructions"
              echo "You can download the APK right now from the **Artifacts** section of this workflow run: **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
