name: Build and Release Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          if [ ! -f "./.env" ]; then
            if [ -f "./.env.example" ]; then
              cp ./.env.example ./.env
            else
              touch ./.env
            fi
          fi
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring permanent debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring permanent debug.keystore from GitHub secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ./debug.keystore
          elif [ ! -f "./debug.keystore" ]; then
            echo "Restoring permanent debug.keystore from embedded base64..."
            cat << 'EOF' | base64 -d > ./debug.keystore

EOF
          fi
          echo "Verified debug.keystore SHA-1 fingerprint:"
          keytool -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF Master Debug Build #${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
