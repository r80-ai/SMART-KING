name: Build and Release Debug APK

on:
  push:
    branches:
      - backup-clean
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version $MAJOR_VERSION is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f "./debug.keystore" ]; then
            echo "Confirmed ./debug.keystore exists."
          else
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file '$EXPECTED_APK' does not exist."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: '$EXPECTED_APK' is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: '$EXPECTED_APK' is empty (0 bytes)."
            exit 1
          fi
          
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: '$EXPECTED_APK' does not have the .apk extension."
            exit 1
          fi
          
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly 'app/build/outputs/apk/debug/app-debug.apk'."
            exit 1
          fi
          
          echo "Verified APK successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK" 2>/dev/null \vert{}\vert{} wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}/apk_release_asset"
          mkdir -p "$RUNNER_TMP_DIR"
          
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" \vert{} tr -cs 'a-zA-Z0-9_-' '-' \vert{} tr '[:upper:]' '[:lower:]' \vert{} sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi
          
          RELEASE_ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${RUNNER_TMP_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Check ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset file not found at: $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is empty: $ASSET_PATH"
            exit 1
          fi
          
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          NOTES=$(cat <<EOF
          ### Automated Debug Build
          
          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Notice**: This APK is intended for testing and development purposes only. It is not a Play Store production release and is signed with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag '$RELEASE_TAG'..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            
            gh release view "$RELEASE_TAG" || true
            
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "## 🚀 Build & Release Succeeded"
              echo ""
              echo "### 📱 Download Debug APK"
              echo "The debug APK has been published to GitHub Releases:"
              echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Direct Download**: You can download **$ASSET_NAME** directly from the **Assets** section of the release page on your phone or computer."
              echo ""
              echo "### 📦 Backup Actions Artifact"
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "APK build succeeded, and the debug APK artifact is safely preserved."
            echo "The GitHub Actions artifact named 'app-debug-apk' is available for download."
            
            {
              echo "## ⚠️ Release Publishing Warning"
              echo ""
              echo "The debug APK was **built successfully** and uploaded as a GitHub Actions artifact."
              echo ""
              echo "However, publishing the APK to GitHub Releases encountered an issue."
              echo ""
              echo "### 📦 Download Instructions"
              echo "You can still download the APK right now from the **Artifacts** section of this workflow run: **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          
