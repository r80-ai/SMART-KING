name: Auto Build and Release Debug APK

on:
  push:
    branches:
      - '**'        # AI Studio theke jekono branch-e push korlei automatic build shuru hobe

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Fast Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Auto Publish to Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF Master Auto Build #${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
